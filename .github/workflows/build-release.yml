# Build installable Bug Bounty IDE on release.
# Push a tag like v1.0.1 to trigger; version in package.json is set from the tag, then installers are uploaded.
name: Build release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node -e "const ref=process.env.GITHUB_REF||'';const v=ref.replace(/^refs\\/tags\\/v?/,'');const p=require('./package.json');p.version=v;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/*.exe
            dist/*.msi

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node -e "const ref=process.env.GITHUB_REF||'';const v=ref.replace(/^refs\\/tags\\/v?/,'');const p=require('./package.json');p.version=v;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Install dependencies
        run: npm install

      - name: Build macOS
        run: npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            dist/*.dmg
            dist/*.zip
            dist/mac/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node -e "const ref=process.env.GITHUB_REF||'';const v=ref.replace(/^refs\\/tags\\/v?/,'');const p=require('./package.json');p.version=v;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Install Linux dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 libasound2t64 libgbm1 libx11-xcb1

      - name: Install dependencies
        run: npm install

      - name: Build Linux
        run: npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: dist/*.AppImage

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-win

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: mac-installers
          path: release-mac

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: release-linux

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-win/*
            release-mac/*
            release-linux/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
