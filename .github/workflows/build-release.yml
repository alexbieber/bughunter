# Build installable Bug Bounty IDE on release.
# Push a tag like v1.0.1 to trigger. Each job sets version from tag, builds, and publishes to the GitHub Release
# (installers + latest.yml / latest-mac.yml / latest-linux.yml) so the installed app's updater can find new versions.
name: Build release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node -e "const ref=process.env.GITHUB_REF||'';const v=ref.replace(/^refs\\/tags\\/v?/,'');const p=require('./package.json');p.version=v;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Install dependencies
        run: npm install

      - name: Build and publish Windows
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node -e "const ref=process.env.GITHUB_REF||'';const v=ref.replace(/^refs\\/tags\\/v?/,'');const p=require('./package.json');p.version=v;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Install dependencies
        run: npm install

      - name: Build and publish macOS
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node -e "const ref=process.env.GITHUB_REF||'';const v=ref.replace(/^refs\\/tags\\/v?/,'');const p=require('./package.json');p.version=v;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Install Linux dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 libasound2t64 libgbm1 libx11-xcb1

      - name: Install dependencies
        run: npm install

      - name: Build and publish Linux
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
